name: Password Checker CI

on:
  push:
    branches:
      - main

jobs:
  test:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-22.04]
        python-version: [3.8, 3.10, 3.12]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: |
          cd src
          python -m pytest

      - name: Run password checker (CLI mode)
        run: |
          cd src
          python password_checker.py Hello123
